[workspace]
resolver = "2"
members = [
    "crates/mycorust-core",
    "crates/mycorust",
    "ideas/climate",
    "ideas/routing",
    "ideas/compression",
    "ideas/generative",
    "ideas/benchmark",
    "ideas/infrastructure",
    "ideas/materials",
    "ideas/ethics",
    "ideas/sound",
    "ideas/evolution",
]
default-members = ["crates/mycorust", "crates/mycorust-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ezeoleaf"]
license = "MIT"

[workspace.dependencies]
mycorust-core = { path = "crates/mycorust-core" }
rand = "0.8"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
